# Render Blueprint: 예약 API 웹 서비스 (무료 플랜)
# DB는 Render 밖의 Aiven MySQL을 쓴다. Render의 관리형 DB는 PostgreSQL뿐인데,
# 이 앱은 MySQL의 락 동작과 오류 번호(1062, 1213, 3819)에 기대기 때문이다.
# 처음 연결하는 방법은 README의 "배포" 섹션을 참고한다.
services:
  - type: web
    name: reservation-api
    runtime: python
    plan: free
    # 한국과 가장 가까운 리전. 만든 뒤에는 바꿀 수 없다.
    region: singapore
    # CI(GitHub Actions)가 통과한 커밋만 배포한다.
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    # 무료 플랜은 preDeployCommand를 쓸 수 없어서, 시작할 때 마이그레이션을 먼저 적용한다.
    # 인스턴스가 하나라서 마이그레이션이 동시에 두 번 돌 일은 없다. 유료 플랜으로 바꾸거나
    # 인스턴스를 늘리면 preDeployCommand로 옮긴다.
    # --proxy-headers: Render의 프록시 뒤에 있으므로 X-Forwarded-* 헤더로 실제 프로토콜(https)과
    # 클라이언트 IP를 알아낸다. 어느 프록시를 믿을지는 아래 FORWARDED_ALLOW_IPS로 정한다.
    startCommand: >-
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    # DB를 확인하지 않는 /health를 쓴다. /health/db로 하면 DB가 잠깐 끊겨도 Render가
    # 앱을 계속 재시작한다. DB 상태는 /health/db로 따로 본다.
    healthCheckPath: /health
    envVars:
      # Aiven 콘솔의 접속 정보. 비밀번호가 있으므로 처음 만들 때 대시보드에서 입력한다.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Aiven의 CA 인증서. 대시보드에서 비밀 파일(Secret File) aiven-ca.pem으로 올린다.
      - key: DB_SSL_CA
        value: /etc/secrets/aiven-ca.pem
      # JWT 서명 키는 Render가 무작위 값(256비트)으로 만든다. 코드나 저장소에는 남지 않는다.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RESERVATION_STRATEGY
        value: lock
      # uvicorn이 X-Forwarded-* 헤더를 믿을 프록시 IP. Render 프록시의 IP는 고정돼 있지 않고,
      # 앱에는 Render 프록시를 거친 요청만 들어오므로 모두(*) 믿는다.
      # 명령줄 인자(--forwarded-allow-ips "*") 대신 환경 변수로 둔 이유: 셸의 * 확장을 피한다.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
