name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 테스트는 실제 MySQL에서 돈다. (락, CHECK 제약, 콜레이션 등 MySQL 동작을 그대로 검증하기 위해)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reservation_test
          MYSQL_USER: reservation_app
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: reservation_app
      DB_PASSWORD: ci-password
      TEST_DB_NAME: reservation_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

  # 운영 이미지(Dockerfile)가 실제로 빌드되고, MySQL과 함께 떠서 요청을 받는지 확인한다.
  # 로컬에는 Docker가 없어서 이미지 검증은 여기서만 한다.
  container:
    runs-on: ubuntu-latest

    # CI 전용 값. 실제 배포의 비밀 값과는 무관하다.
    env:
      DB_PASSWORD: ci-compose-password
      JWT_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256-0123456789

    steps:
      - uses: actions/checkout@v7

      # --wait: 앱 컨테이너의 HEALTHCHECK가 통과할 때까지 기다린다. 시작 스크립트가
      # 마이그레이션에서 실패하거나 서버가 죽으면 여기서 실패한다.
      - name: Build image and start app with MySQL
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/health/db
          # 마이그레이션이 적용되어 테이블이 있어야 200이 나온다.
          curl -fsS http://localhost:8000/resources
          docker compose exec -T app python -m alembic current
          # root가 아닌 전용 사용자(uid 10001)로 돌아야 한다.
          test "$(docker compose exec -T app id -u)" = "10001"

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
